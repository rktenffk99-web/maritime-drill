name: Pronunciation dictionary and browser review
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pronunciation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dictionary audit and full English corpus
        run: |
          python tools/test_pronunciation_dictionary.py
          python tools/build_english_word_study.py
          python tools/audit_english_pronunciations.py
          node tools/test_pronunciation_display.js
          node tools/test_english_word_study.js
          git diff --exit-code -- english-study-glossary.js english-study/coverage.json
      - name: Install isolated browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          echo "MD_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Check real question cards and mobile layout
        run: python tools/browser_pronunciation_review.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pronunciation-browser-review
          path: browser-test-results/
          retention-days: 14
