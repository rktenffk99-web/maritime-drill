name: App regression checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild and test final app without writing to the repository
        run: bash tools/check_app.sh
      - uses: actions/upload-artifact@v6
        with:
          name: tested-app
          path: index.html
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: rebuild
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - browser_smoke.py
          - browser_mock_recovery.py
          - browser_unified_mock.py
          - browser_response_speed.py
          - browser_integrity.py
          - browser_daily_storage.py
          - browser_drive_auth.py
          - browser_menu_cleanup.py
          - browser_mock_subject_order.py
          - browser_balanced_mock.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tested-app
          path: .
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise isolated browser flow
        env:
          BROWSER_TEST: ${{ matrix.test }}
        run: python "tools/$BROWSER_TEST"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-${{ matrix.test }}
          path: browser-test-results/
          retention-days: 7

  regression:
    if: ${{ always() }}
    needs: [rebuild, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require the build and every browser suite to pass
        env:
          REBUILD_RESULT: ${{ needs.rebuild.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$REBUILD_RESULT" = success && test "$BROWSER_RESULT" = success
