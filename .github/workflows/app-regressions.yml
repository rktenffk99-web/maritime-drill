name: App regression checks

on:
  push:
    branches: ['fix/audit-sync-analytics-20260921']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect public source for isolated regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('audit-source.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for path in [Path('index.html'), *Path('.').glob('*.js'), *Path('tools').glob('*'), *Path('.github/workflows').glob('*.yml')]:
                  if path.is_file():
                      out.write(path, str(path))
          html = Path('index.html').read_text(encoding='utf-8-sig')
          for name in ['applyBackupSnapshot', 'driveSyncUploadRemote', 'driveSyncInit', 'ppWeakTopicId', 'driveSyncSaveState']:
              start = html.find('function ' + name + '(')
              print('\n=== ' + name + ' ===\n' + html[start:start+3000] if start >= 0 else name + ': not found')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source
          path: audit-source.zip
          retention-days: 1
