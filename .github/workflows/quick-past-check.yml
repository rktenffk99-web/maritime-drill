name: Quick second-officer merchant-only test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quick-past-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python tools/patch_navi2_merchant_only.py
      - run: node tools/test_navi2_merchant_only.js
