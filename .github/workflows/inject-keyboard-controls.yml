name: Patch pass-plan app

on:
  push:
    branches: [ main, feature/2026-priority-navigation ]
    paths:
      - 'keyboard-controls.js'
      - 'convenience-controls.js'
      - 'tools/patch_pass_plan.py'
      - 'tools/patch_convenience.py'
      - 'tools/extract_passplan_debug.py'
      - '.github/workflows/inject-keyboard-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python tools/patch_pass_plan.py
          python tools/patch_convenience.py
          if [ -f tools/extract_passplan_debug.py ]; then python tools/extract_passplan_debug.py; fi
      - name: Commit index update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if [ -f debug/passplan-context.txt ]; then git add debug/passplan-context.txt; fi
          if git diff --cached --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git commit -m 'Extract pass-plan context for 2026 priority work'
          git push
