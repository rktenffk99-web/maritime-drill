name: Patch pass-plan app

on:
  push:
    branches: [ main, feature/reports-and-2026-explanations ]
    paths:
      - 'keyboard-controls.js'
      - 'convenience-controls.js'
      - 'tools/patch_pass_plan.py'
      - 'tools/patch_convenience.py'
      - 'tools/patch_2026_navigation.py'
      - 'tools/patch_same_day_confirmation.py'
      - 'tools/patch_predictive_mock.py'
      - 'tools/patch_predictive_mock_followup.py'
      - 'tools/test_predictive_mock.py'
      - 'tools/audit_2026_explanations.py'
      - '.github/workflows/inject-keyboard-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python tools/patch_pass_plan.py
          python tools/patch_convenience.py
          python tools/patch_2026_navigation.py
          python tools/patch_same_day_confirmation.py
          python tools/patch_predictive_mock.py
          python tools/patch_predictive_mock_followup.py
          python tools/test_predictive_mock.py
          python tools/audit_2026_explanations.py
      - name: Commit audit output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if [ -d debug ]; then git add debug; fi
          if git diff --cached --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git commit -m 'Audit 2026 explanation coverage'
          git push
