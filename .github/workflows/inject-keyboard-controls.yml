name: Patch pass-plan app

on:
  push:
    branches: [ main ]
    paths:
      - 'keyboard-controls.js'
      - 'convenience-controls.js'
      - 'tools/patch_pass_plan.py'
      - 'tools/patch_convenience.py'
      - 'tools/patch_2026_navigation.py'
      - 'tools/patch_same_day_confirmation.py'
      - '.github/workflows/inject-keyboard-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python tools/patch_pass_plan.py
          python tools/patch_convenience.py
          python tools/patch_2026_navigation.py
          python tools/patch_same_day_confirmation.py
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Require same-day confirmation before next-day mastery'
          git push
