name: Patch pass-plan app

on:
  push:
    branches: [ main ]
    paths:
      - 'keyboard-controls.js'
      - 'convenience-controls.js'
      - 'explain-2026-navi3-3.js'
      - 'tools/patch_pass_plan.py'
      - 'tools/patch_convenience.py'
      - 'tools/patch_2026_navigation.py'
      - 'tools/patch_same_day_confirmation.py'
      - 'tools/patch_predictive_mock.py'
      - 'tools/patch_predictive_mock_followup.py'
      - 'tools/patch_predictive_mock_personalization.py'
      - 'tools/patch_2026_session3_explanations.py'
      - 'tools/patch_weak_drills.py'
      - 'tools/patch_recovery_recheck.py'
      - 'tools/patch_stable_session_counter.py'
      - 'tools/patch_rotation_mix.py'
      - 'tools/patch_grade_priority.py'
      - 'tools/test_predictive_mock.py'
      - 'tools/test_predictive_mock_personalization.py'
      - 'tools/test_problem_report_modes.py'
      - 'tools/test_2026_session3_explanations.py'
      - 'tools/test_weak_drills.py'
      - 'tools/test_recovery_recheck.py'
      - 'tools/test_rotation_mix.py'
      - 'tools/test_grade_priority.py'
      - '.github/workflows/inject-keyboard-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python tools/patch_pass_plan.py
          python tools/patch_convenience.py
          python tools/patch_2026_navigation.py
          python tools/patch_same_day_confirmation.py
          python tools/patch_predictive_mock.py
          python tools/patch_predictive_mock_followup.py
          python tools/patch_predictive_mock_personalization.py
          python tools/patch_2026_session3_explanations.py
          python tools/patch_weak_drills.py
          python tools/patch_recovery_recheck.py
          python tools/patch_stable_session_counter.py
          python tools/patch_rotation_mix.py
          python tools/patch_grade_priority.py
          python tools/test_predictive_mock.py
          python tools/test_predictive_mock_personalization.py
          python tools/test_problem_report_modes.py
          python tools/test_2026_session3_explanations.py
          python tools/test_weak_drills.py
          python tools/test_recovery_recheck.py
          python tools/test_rotation_mix.py
          python tools/test_grade_priority.py
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply pass-plan patches'
          git push
