name: Patch pass-plan app

on:
  push:
    branches: [main, 'fix/audit-sync-analytics-20260921', 'fix/learning-integrity-v511', 'fix/daily-storage-v512']
    paths:
      - 'index.html'
      - '*.js'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and test final app
        run: bash tools/check_app.sh
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply tested app patches'
          git push
