name: Inject keyboard controls

on:
  push:
    branches: [ main ]
    paths:
      - 'keyboard-controls.js'
      - '.github/workflows/inject-keyboard-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject keyboard control script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8-sig')
          tag = '<script src="keyboard-controls.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker in text:
                  text = text.replace(marker, tag + '\n' + marker, 1)
              else:
                  text += '\n' + tag + '\n'
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load keyboard controls in app'
          git push
