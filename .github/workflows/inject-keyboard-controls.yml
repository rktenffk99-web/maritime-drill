name: Patch pass-plan app

on:
  push:
    branches: [main, 'fix/audit-sync-analytics-20260921', 'fix/learning-integrity-v511', 'fix/daily-storage-v512', 'fix/drive-auth-v513', 'fix/menu-cleanup-v514', 'codex/compact-question-header-v5-15', 'fix/answer-flow-v516', 'codex/mock-subject-order', 'codex/balanced-mock-v517']
    paths:
      - 'index.html'
      - '*.js'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rebuild and test final app
        run: bash tools/check_app.sh
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi

          # Do not let a workflow for an older commit overwrite a newer push.
          git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
            echo 'A newer commit already exists. Skipping this stale generated index; the newer run will rebuild it.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply tested app patches'

          # A newer commit can still arrive between the stale check and push.
          # Ignore only a genuine superseded push; do not hide auth/network failures.
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            parent_sha="$(git rev-parse HEAD^)"
            git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            remote_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
            if [ "$remote_sha" != "$parent_sha" ]; then
              echo 'Remote advanced while this run was finishing. A newer run owns the final rebuild.'
              exit 0
            fi
            echo 'Push failed without a newer remote commit; treating as a real CI failure.'
            exit 1
          fi
