name: Patch pass-plan app

on:
  push:
    branches: [ main, fix/pass-plan-stable-progress ]
    paths:
      - 'keyboard-controls.js'
      - 'tools/patch_pass_plan.py'
      - '.github/workflows/inject-keyboard-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python tools/patch_pass_plan.py
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep pass-plan total fixed and resume at saved position'
          git push
