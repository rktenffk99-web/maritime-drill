name: Build weak drills on feature
on:
  push:
    branches: [ feature/today-wrong-and-frequent-wrong ]
    paths:
      - 'tools/patch_weak_drills.py'
      - 'tools/test_weak_drills.py'
      - '.github/workflows/inject-keyboard-controls.yml'
      - '.github/workflows/inspect-weak-drill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and test patches
        run: |
          python tools/patch_pass_plan.py
          python tools/patch_convenience.py
          python tools/patch_2026_navigation.py
          python tools/patch_same_day_confirmation.py
          python tools/patch_predictive_mock.py
          python tools/patch_predictive_mock_followup.py
          python tools/patch_2026_session3_explanations.py
          python tools/patch_weak_drills.py
          python tools/test_predictive_mock.py
          python tools/test_2026_session3_explanations.py
          python tools/test_weak_drills.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated index change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add focused wrong-answer drills'
          git push
